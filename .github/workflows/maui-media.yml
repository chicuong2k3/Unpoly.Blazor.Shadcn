name: MAUI creative media

on:
  pull_request:
    paths:
      - '.github/workflows/maui-media.yml'
      - 'src/**'
      - 'demo/Unpoly.Blazor.Shadcn.Maui/**'
      - 'demo/creative-media.css'
      - 'tools/maui-webview-smoke.cjs'
      - 'tools/creative-media-browser-checks.cjs'
      - 'tools/package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maui-media-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  webview2:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Install tooling
        run: npm ci --prefix tools
      - name: Ensure Evergreen WebView2 runtime is available
        run: |
          $runtimePaths = @(
            "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe",
            "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe"
          )
          $runtime = Get-ChildItem -Path $runtimePaths -ErrorAction SilentlyContinue
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
              throw 'WebView2 bootstrapper signature could not be verified'
            }
            $process = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            if ($process.ExitCode -notin @(0,3010)) { throw "WebView2 install failed: $($process.ExitCode)" }
            $runtime = Get-ChildItem -Path $runtimePaths -ErrorAction SilentlyContinue
          }
          if (-not $runtime) { throw 'Evergreen WebView2 executable is missing after installation' }
          $runtime | Select-Object FullName,@{Name='Version';Expression={$_.VersionInfo.ProductVersion}}
      - name: Build unpackaged Windows demo with its App SDK runtime
        run: >-
          dotnet build demo/Unpoly.Blazor.Shadcn.Maui/Unpoly.Blazor.Shadcn.Maui.csproj
          --configuration Debug --framework net10.0-windows10.0.19041.0
          --runtime win-x64 -p:WindowsAppSDKSelfContained=true
      - name: Check creative media in native WebView2 with both stylesheets
        env:
          MAUI_MEDIA_REPORT_DIR: ${{ runner.temp }}/maui-media-reports
        run: |
          # Elevated hosted runners require the machine-policy channel. Scope it to
          # this disposable demo executable and restore its prior value in finally.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $application = 'Unpoly.Blazor.Shadcn.Maui.exe'
          $existed = Test-Path $policy
          if (-not $existed) { New-Item -Path $policy -Force | Out-Null }
          $key = Get-Item $policy
          $hadValue = $key.GetValueNames() -contains $application
          $oldValue = if ($hadValue) { $key.GetValue($application, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) } else { $null }
          $oldKind = if ($hadValue) { $key.GetValueKind($application) } else { 'String' }
          if ($hadValue -and $oldKind.ToString() -notin @('String','ExpandString')) { throw 'Unexpected existing app policy type; refusing to overwrite' }
          try {
            New-ItemProperty -Path $policy -Name $application -PropertyType String -Value '--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1' -Force | Out-Null
            $env:MAUI_SMOKE_CDP_PORT = '9222'
            node tools/maui-webview-smoke.cjs --creative-media-only
            if ($LASTEXITCODE -ne 0) { throw "v3 native checks failed: $LASTEXITCODE" }
            node tools/maui-webview-smoke.cjs --creative-media-only --baseline
            if ($LASTEXITCODE -ne 0) { throw "v4 native checks failed: $LASTEXITCODE" }
          } finally {
            if ($hadValue) { (Get-Item $policy).SetValue($application, $oldValue, $oldKind) }
            else { Remove-ItemProperty -Path $policy -Name $application -ErrorAction SilentlyContinue }
            $key = Get-Item $policy
            if (-not $existed -and $key.GetValueNames().Count -eq 0 -and $key.GetSubKeyNames().Count -eq 0) { Remove-Item $policy }
          }
      - name: Collect native startup diagnostics on failure
        if: failure()
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'maui-media-reports'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          @{
            Interactive = [Environment]::UserInteractive
            SessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
            OS = [Environment]::OSVersion.VersionString
          } | ConvertTo-Json | Out-File (Join-Path $output 'host.json')
          Get-Process -Name 'Unpoly.Blazor.Shadcn.Maui','msedgewebview2' -ErrorAction SilentlyContinue |
            Select-Object ProcessName,Id,SessionId,MainWindowTitle |
            ConvertTo-Json | Out-File (Join-Path $output 'processes.json')
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('.NET Runtime','Application Error') } |
            Select-Object -First 20 TimeCreated,ProviderName,Id,Message |
            ConvertTo-Json | Out-File (Join-Path $output 'application-errors.json')
      - name: Save native reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maui-creative-media
          path: ${{ runner.temp }}/maui-media-reports
          if-no-files-found: ignore
