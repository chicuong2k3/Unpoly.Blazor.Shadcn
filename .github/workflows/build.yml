name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build repository tools
        run: dotnet build tools/Unpoly.Blazor.Shadcn.Tools --configuration Release

      # The generated files are committed, so CI never needs the network — it only proves that
      # what is committed is what the generators produce. A stale API index or a component whose
      # classes were edited by hand fails here rather than being discovered by a reader.
      - name: Generated files are current
        run: |
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- extract-upstream --check
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- sync-classes --check
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- sync-variants --check
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- gen-api --check
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- fetch-upstream --check
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- fetch-examples --check
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- gen-themes --check

      # Nothing left to scaffold, and nothing quietly unaccounted for.
      - name: Every upstream slot is ported or refused with a reason
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- scaffold-components --check

      # Two rules in shadcn's globals that are not tokens, and are silent when missing.
      - name: ui.css reproduces shadcn's globals
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-globals --check

      # A component that is mostly an icon, rendering no icon, passes class parity: the class
      # list of an element that draws nothing is still the right class list.
      - name: Every icon shadcn draws is drawn here
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-icons --check

      # A <div> where shadcn writes a <span> looks fine in a screenshot and is wrong in a
      # paragraph: different box, different default role, different rules about what may go in it.
      - name: Every element matches shadcn
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-elements --check

      # A class rule keyed off an attribute nobody renders matches nothing, in silence.
      - name: Every data- rule has an attribute to match
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-data-attributes --check

      # Not a --check with a target: the demo is being brought up to what shadcn documents,
      # section by section, and this reports the number and holds a floor under it.
      - name: The demo shows what shadcn shows
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-sections --check --floor=304

      # The demo's pages are named and ordered as shadcn documents them, so a URL is guessable.
      - name: The demo matches shadcn's docs index
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-pages --check

      # A class that compiles to nothing. Upstream's own has-[>a,>button]:hover:bg-muted/50 did:
      # a comma ends the candidate, and Tailwind drops the whole thing without a warning.
      - name: Every class this library writes compiles to a rule
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-compiled --check

      # A side named by the screen rather than by the reading direction. AccordionTrigger said
      # text-left, which left-aligns Arabic, and it was one of forty.
      - name: Every side is named in reading order
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-rtl --check

      # A control that does nothing when clicked. AlertDialog shipped inert for as long as it
      # existed, because an attribute selector is exact and nothing said so.
      - name: Every interactive control is operated by something
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-wiring --check

      # A component nobody can look at is a component nobody reviews.
      - name: Every component is shown in the demo
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- check-demo --check

      # Not a --check: it reports, and a gap is a decision rather than a build break.
      - name: API coverage report
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- audit-api

      # gen_icons needs lucide-static, which is the one generator with a dependency.
      - run: npm ci
      - name: Icons are current
        run: dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- gen-icons --check

      # The built CSS is committed, but regenerate it so the check always sees the
      # actual output of the current source rather than a stale build artifact.
      - name: Safari 15 CSS compatibility
        run: |
          npm ci --prefix demo/Unpoly.Blazor.Shadcn.Demo
          npm run css --prefix demo/Unpoly.Blazor.Shadcn.Demo
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- safari15-check
          dotnet run --project tools/Unpoly.Blazor.Shadcn.Tools --configuration Release --no-build -- gen-has-fallback --check

      # MAUI builds on Windows only (see AGENTS.md): this runner has no MAUI
      # workloads, so CI builds every project except the MAUI head here.
      - name: Build libraries, web demo and tests
        run: |
          dotnet build src/Unpoly.Blazor.Shadcn/Unpoly.Blazor.Shadcn.csproj --configuration Release
          dotnet build src/Unpoly.Blazor.Shadcn.ECharts/Unpoly.Blazor.Shadcn.ECharts.csproj --configuration Release
          dotnet build src/Unpoly.Blazor.Shadcn.Maps/Unpoly.Blazor.Shadcn.Maps.csproj --configuration Release
          dotnet build demo/Unpoly.Blazor.Shadcn.Demo/Unpoly.Blazor.Shadcn.Demo.csproj --configuration Release
          dotnet build tests/Unpoly.Blazor.Shadcn.Tests/Unpoly.Blazor.Shadcn.Tests.csproj --configuration Release
          dotnet build tests/Unpoly.Blazor.Shadcn.Behaviour/Unpoly.Blazor.Shadcn.Behaviour.csproj --configuration Release

      # The behaviour suite drives a real browser against the real demo, and skips rather than
      # fails when there is none — so without this step it would go green having run nothing.
      # That is the one failure mode a skip-on-missing suite has, and it is worth one line.
      - name: Install the browser the behaviour suite drives
        run: pwsh tests/Unpoly.Blazor.Shadcn.Behaviour/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - run: dotnet test --configuration Release --no-build --verbosity quiet

      # A skipped behaviour test is a test that did not run, and the point of the suite is that
      # it runs. This fails if any of them skipped.
      - name: Every behaviour test actually ran
        run: |
          dotnet test tests/Unpoly.Blazor.Shadcn.Behaviour --configuration Release --no-build \
            --logger "console;verbosity=minimal" | tee behaviour.log
          grep -q "Skipped:     0" behaviour.log
