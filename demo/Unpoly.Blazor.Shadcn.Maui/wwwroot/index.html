<!DOCTYPE html>
<!-- js-has-pseudo scopes the Safari 15 :has() fallbacks (see App.razor in the
     web head for why it must stay). -->
<html lang="en" class="js-has-pseudo">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Unpoly.Blazor.Shadcn.Maui</title>
    <base href="/" />
    <!-- v3 loads without JavaScript; ?demo-css=v4 provides rollback comparison. -->
    <link id="demo-app-css" rel="stylesheet" href="app.v3.css" />
    <script>
        (function () {
            var css = new URL(location.href).searchParams.get('demo-css');
            if (css === 'v3' || css === 'v4') sessionStorage.setItem('demo-css', css);
            var link = document.getElementById('demo-app-css');
            if (sessionStorage.getItem('demo-css') === 'v4') link.href = 'app.css';
            link.dataset.demoCss = sessionStorage.getItem('demo-css') === 'v4' ? 'v4' : 'v3';
        })();
    </script>
    <!-- v3 on engines without native container queries needs this
         parser-blocking named-container runtime. Default v4 never requests it. -->
    <script>
        if (document.getElementById('demo-app-css').dataset.demoCss === 'v3' &&
            !(window.CSS && CSS.supports && CSS.supports('container-type', 'inline-size')))
            document.write('\x3cscript src="container-fallback.v3.js">\x3c/script>');
    </script>
    <link rel="stylesheet" href="_content/Unpoly.Blazor.Shadcn/ui.safari15.css" />
    <link rel="stylesheet" href="_content/Unpoly.Blazor.Shadcn/cropperjs/cropper.min.css" />
    <link rel="stylesheet" href="_content/Unpoly.Blazor.Shadcn/toastify/toastify.css" />
    <link rel="stylesheet" href="_content/Unpoly.Blazor.Shadcn/airdatepicker/air-datepicker.css" />
    <link rel="icon" href="data:,">

    <script>
        // Theme + dark mode, read from localStorage BEFORE the body paints — the same guarantee
        // the web head makes in its App.razor. A theme applied after first paint is a flash of
        // the wrong one.
        (function () {
            var t = localStorage.getItem('demo-theme');
            if (t === 'apple' || t === 'dracula') document.documentElement.dataset.theme = t;
            else if (t && t !== 'shadcn') localStorage.removeItem('demo-theme');
            if (localStorage.getItem('demo-dark') === '1') document.documentElement.classList.add('dark');
        })();
    </script>

    <!-- Safari 15 compat: ES2023 shims + Popover API polyfill, both feature-detected.
         Must load BEFORE unpoly.min.js so the polyfilled APIs exist when Unpoly initialises. -->
    <script src="_content/Unpoly.Blazor.Shadcn/compat/safari15-shim.js"></script>
    <script src="_content/Unpoly.Blazor.Shadcn/compat/popover.iife.min.js"></script>
    <script src="_content/Unpoly.Blazor.Shadcn/compat/css-has-pseudo.js"></script>
    <script src="_content/Unpoly.Blazor.Shadcn/compat/has-pseudo-boot.js"></script>

    <!-- Unpoly is here for exactly one thing: `up.compiler`, which is the whole API surface
         ui.js uses (29 registrations plus two `up.on`). Its navigation is NOT wanted — Blazor's
         router owns that. Nothing needs disabling: Unpoly's followSelectors default to
         [up-follow] only, so a plain <a href> stays Blazor's. AddUnpoly()/<UnpolyHead /> are
         what would push 'a[href]' in, which is one reason neither appears in this project. -->
    <script src="_content/Unpoly.Blazor/unpoly.min.js"></script>

    <script>
        // Blazor's renderer mutates the DOM directly, so Unpoly never sees an insertion and its
        // compilers never run on it: every dropdown, dialog, tab strip and select is silently
        // inert. Nothing logs, nothing throws — the click just does nothing.
        //
        // up.hello() compiles a subtree; up.destroy() runs the destructors. Both halves matter:
        // without the removedNodes branch every navigation leaks the timers and listeners that
        // ui.js's compilers set up, and that failure is invisible until the app feels slow.
        addEventListener('DOMContentLoaded', () => {
            // Compile whatever Blazor has already rendered by now (the first paint). Without
            // this, the theme picker / dark toggle / customizer in the header are registered
            // by demo.js before any DOM exists, and only a later mutation would compile them.
            up.hello(document.body)
            new MutationObserver(records => {
                // Blazor can insert a parent and many children in one observer batch. Calling
                // up.hello on every child re-walks the same calendar subtree hundreds of times.
                // Only live outermost inserted roots need compilation; an added ancestor covers
                // all of its descendants. Moved nodes remain connected and must not be destroyed.
                const added = new Set()
                for (const record of records)
                    for (const node of record.addedNodes)
                        if (node.nodeType === 1 && node.isConnected) added.add(node)
                for (const node of added) {
                    let covered = false
                    for (let parent = node.parentElement; parent; parent = parent.parentElement)
                        if (added.has(parent)) { covered = true; break }
                    // Include the parent: a trigger can be inserted before its panel in a
                    // separate batch. Its compiler bails until the panel exists; compiling
                    // the new panel alone would never retry that earlier trigger.
                    if (!covered) up.hello(node.parentElement || node)
                }
                for (const record of records)
                    for (const node of record.removedNodes)
                        if (node.nodeType === 1 && !node.isConnected) up.destroy(node)
            }).observe(document.body, { childList: true, subtree: true })
        })
    </script>

    <script src="_content/Unpoly.Blazor.Shadcn/toastify/toastify.js" defer></script>
    <script src="_content/Unpoly.Blazor.Shadcn/airdatepicker/air-datepicker.js" defer></script>
    <script src="_content/Unpoly.Blazor.Shadcn/ui.js" defer></script>
    <script src="_content/Unpoly.Blazor.Shadcn.ECharts/echarts.js" defer></script>
    <script src="_content/Unpoly.Blazor.Shadcn.Maps/map/map.js" defer></script>
    <script src="demo.js" defer></script>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet
         class="fixed bottom-0 left-0 z-50 hidden w-full bg-destructive px-6 py-3 text-destructive-foreground shadow-lg">
        An unhandled error has occurred.
        <a href="." class="reload underline">Reload</a>
        <span class="dismiss cursor-pointer">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
